<div class="md-copyright notranslate" translate="no">
  <div class="md-copyright__highlight">
    <span class="footer-copyright">© <strong translate="no">{{ config.extra.footer_name or config.site_name }}</strong>. All rights reserved.</span>
    {% for tagline in config.extra.footer_taglines or [] %}
    <span class="footer-tagline">{{ tagline }}</span>
    {% endfor %}
    <nav class="footer-links" aria-label="Legal">
      <a href="{{ 'legal/privacy-policy/' | url }}">Privacy Policy</a>
      <span class="footer-links-sep" aria-hidden="true">-</span>
      <a href="{{ 'legal/website-terms/' | url }}">Website Terms</a>
      <span class="footer-links-sep" aria-hidden="true">-</span>
      <a href="{{ 'legal/copyright-and-licensing/' | url }}">Copyright and Licensing</a>
      <span class="footer-links-sep" aria-hidden="true">-</span>
      <a href="{{ 'legal/disclaimer/' | url }}">Disclaimer</a>
    </nav>
  </div>
</div>
